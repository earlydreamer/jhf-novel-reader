apply plugin: 'com.android.application'

// Bind packaged native/web bytes to the source checkout used for this build.
// The final artifact audit rejects dirty or stale provenance.
def provenanceAssets = layout.buildDirectory.dir('generated/sourceProvenance/assets')
def gitValue = { List<String> arguments ->
    providers.exec {
        workingDir rootProject.projectDir.parentFile
        commandLine(['git'] + arguments)
    }.standardOutput.asText.get().trim()
}
def generateSourceProvenance = tasks.register('generateSourceProvenance') {
    outputs.dir(provenanceAssets)
    outputs.upToDateWhen { false }
    doLast {
        def destination = provenanceAssets.get().file('source-provenance.json').asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.toJson([
            commit: gitValue(['rev-parse', 'HEAD']),
            tree: gitValue(['rev-parse', 'HEAD^{tree}']),
            dirty: !gitValue(['status', '--porcelain', '--untracked-files=normal']).isEmpty()
        ]) + '\n'
    }
}
tasks.named('preBuild').configure { dependsOn(generateSourceProvenance) }

// 앱 버전은 package.json의 version 하나로 정한다(#182). versionCode = major*10000 + minor*100 + patch.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def appVersionParts = appVersion.tokenize('.').collect { it as Integer }
if (appVersionParts.size() != 3 || appVersionParts[1] > 99 || appVersionParts[2] > 99) {
    throw new GradleException("package.json version must be major.minor.patch with minor/patch <= 99: ${appVersion}")
}
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

android {
    namespace = "app.narou.reader"
    sourceSets.main.assets.srcDir(provenanceAssets)
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.narou.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
