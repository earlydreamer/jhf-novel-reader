apply plugin: 'com.android.application'

// Bind packaged native/web bytes to the source checkout used for this build.
// The final artifact audit rejects dirty or stale provenance.
def provenanceAssets = layout.buildDirectory.dir('generated/sourceProvenance/assets')
def gitValue = { List<String> arguments ->
    providers.exec {
        workingDir rootProject.projectDir.parentFile
        commandLine(['git'] + arguments)
    }.standardOutput.asText.get().trim()
}
def generateSourceProvenance = tasks.register('generateSourceProvenance') {
    outputs.dir(provenanceAssets)
    outputs.upToDateWhen { false }
    doLast {
        def destination = provenanceAssets.get().file('source-provenance.json').asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.toJson([
            commit: gitValue(['rev-parse', 'HEAD']),
            tree: gitValue(['rev-parse', 'HEAD^{tree}']),
            dirty: !gitValue(['status', '--porcelain', '--untracked-files=normal']).isEmpty()
        ]) + '\n'
    }
}
tasks.named('preBuild').configure { dependsOn(generateSourceProvenance) }

// 앱 버전은 package.json의 version 하나로 정한다(#182). versionCode = major*10000 + minor*100 + patch.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def appVersionParts = appVersion.tokenize('.').collect { it as Integer }
if (appVersionParts.size() != 3 || appVersionParts[1] > 99 || appVersionParts[2] > 99) {
    throw new GradleException("package.json version must be major.minor.patch with minor/patch <= 99: ${appVersion}")
}
def appVersionCode = appVersionParts[0] * 10000 + appVersionParts[1] * 100 + appVersionParts[2]

// 릴리스 서명(#272). 키 파일과 비밀번호는 저장소 밖에 두고 android/keystore.properties(git 제외)나
// 환경 변수 JHF_KEYSTORE_FILE·JHF_KEYSTORE_PASSWORD·JHF_KEY_ALIAS·JHF_KEY_PASSWORD로 넘긴다.
// 둘 다 없으면 릴리스 빌드는 서명 없이 만들어진다. 절차는 docs/release.md.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String env, String key -> System.getenv(env) ?: keystoreProperties.getProperty(key) }
def releaseStoreFile = signingValue('JHF_KEYSTORE_FILE', 'storeFile')

android {
    namespace = "dev.earlydreamer.jhfreader"
    sourceSets.main.assets.srcDir(provenanceAssets)
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.earlydreamer.jhfreader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // LiteRT-LM 네이티브 라이브러리는 arm64-v8a만 넣는다(x86_64는 APK 크기만 키운다).
        ndk {
            abiFilters 'arm64-v8a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStoreFile) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue('JHF_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('JHF_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('JHF_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // 원문 브라우저의 문서 시작 스크립트. Capacitor가 쓰는 버전과 같게 둔다.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // 기기 임베딩(EmbeddingGemma 2). 버전 고정: latest.release 금지.
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.18.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
